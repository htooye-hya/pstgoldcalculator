<script type="text/babel" data-presets="react">
const { useState, useMemo } = React;

// ---- theme -------------------------------------------------------------
const C = {
  bg: "#141110",
  panel: "#181410",
  panelBorder: "#3a3327",
  fieldBg: "#211c14",
  fieldBorder: "#463d2c",
  fieldBorderFocus: "#c9962c",
  cream: "#f4edd9",
  mutedText: "#b3a891",
  dimText: "#8a8071",
  faintText: "#6b6252",
  gold: "#c9962c",
  goldSoft: "#c9962c33",
  danger: "#d98a63",
};

// ---- core unit math -------------------------------------------------
const toPel = (kyat, pel, yway) =>
  (Number(kyat) || 0) * 16 + (Number(pel) || 0) + (Number(yway) || 0) / 8;

const fromPel = (totalPel) => {
  const safe = Math.max(0, totalPel || 0);
  const kyat = Math.floor(safe / 16);
  const remainder = safe - kyat * 16;
  const pel = Math.floor(remainder);
  const yway = Math.round((remainder - pel) * 8 * 100) / 100;
  return { kyat, pel, yway };
};

const fmt = (n, d = 2) =>
  (Number.isFinite(n) ? n : 0).toLocaleString("en-US", {
    minimumFractionDigits: 0,
    maximumFractionDigits: d,
  });

const WeightLine = ({ kyat, pel, yway }) => (
  <span>
    <b>{fmt(kyat, 0)}</b> ကျပ် <b>{fmt(pel, 0)}</b> ပဲ <b>{fmt(yway)}</b> ရွေး
  </span>
);

// ---- shared field components -----------------------------------------
const Label = ({ children }) => (
  <span style={{ fontSize: 11, letterSpacing: 0.5, color: C.mutedText, textTransform: "uppercase" }}>
    {children}
  </span>
);

const NumberField = ({ label, value, onChange, suffix, step = "any" }) => {
  const [focused, setFocused] = useState(false);
  return (
    <label style={{ display: "flex", flexDirection: "column", gap: 4 }}>
      <Label>{label}</Label>
      <div
        style={{
          display: "flex",
          alignItems: "center",
          borderRadius: 10,
          border: `1px solid ${focused ? C.fieldBorderFocus : C.fieldBorder}`,
          background: C.fieldBg,
          transition: "border-color 0.15s",
        }}
      >
        <input
          type="number"
          inputMode="decimal"
          step={step}
          value={value}
          onFocus={() => setFocused(true)}
          onBlur={() => setFocused(false)}
          onChange={(e) => onChange(e.target.value)}
          style={{ width: "100%", background: "transparent", border: "none", outline: "none", padding: "10px 12px", color: C.cream, fontSize: 15 }}
          placeholder="0"
        />
        {suffix && (
          <span style={{ paddingRight: 12, fontSize: 13, color: C.dimText, whiteSpace: "nowrap" }}>{suffix}</span>
        )}
      </div>
    </label>
  );
};

const WeightInputs = ({ k, p, y, setK, setP, setY }) => (
  <div className="grid3">
    <NumberField label="ကျပ်" value={k} onChange={setK} />
    <NumberField label="ပဲ" value={p} onChange={setP} />
    <NumberField label="ရွေး" value={y} onChange={setY} />
  </div>
);

const PuritySelect = ({ label, value, onChange }) => {
  const [focused, setFocused] = useState(false);
  return (
    <label style={{ display: "flex", flexDirection: "column", gap: 4 }}>
      <Label>{label}</Label>
      <div style={{ display: "flex", alignItems: "center", borderRadius: 10, border: `1px solid ${focused ? C.fieldBorderFocus : C.fieldBorder}`, background: C.fieldBg }}>
        <input
          type="number"
          inputMode="decimal"
          step="0.1"
          min="1"
          max="16"
          value={value}
          onFocus={() => setFocused(true)}
          onBlur={() => setFocused(false)}
          onChange={(e) => onChange(e.target.value)}
          style={{ width: "100%", background: "transparent", border: "none", outline: "none", padding: "10px 12px", color: C.cream, fontSize: 15 }}
        />
        <span style={{ paddingRight: 12, fontSize: 13, color: C.dimText, whiteSpace: "nowrap" }}>/ ၁၆ ပဲရည်</span>
      </div>
    </label>
  );
};

const ResultCard = ({ title, children, accent }) => (
  <div style={{ borderRadius: 14, padding: 16, border: `1px solid ${accent || C.goldSoft}`, background: "linear-gradient(155deg, #2a2416, #201b12)" }}>
    <div style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: 1.5, color: C.gold, marginBottom: 8 }}>{title}</div>
    <div style={{ color: C.cream, lineHeight: 1.6, fontSize: 15 }}>{children}</div>
  </div>
);

const Divider = () => <div style={{ height: 1, background: C.panelBorder, margin: "18px 0" }} />;
const Hint = ({ children }) => <p style={{ fontSize: 13, color: C.faintText }}>{children}</p>;
const Note = ({ children }) => <p style={{ fontSize: 11, color: C.faintText, marginTop: 4 }}>{children}</p>;

const ScaleMark = () => (
  <svg viewBox="0 0 64 40" width={56} height={35} fill="none">
    <line x1="32" y1="2" x2="32" y2="10" stroke={C.gold} strokeWidth="1.4" />
    <line x1="8" y1="10" x2="56" y2="10" stroke={C.gold} strokeWidth="1.4" />
    <line x1="8" y1="10" x2="4" y2="24" stroke={C.gold} strokeWidth="1.1" />
    <line x1="8" y1="10" x2="12" y2="24" stroke={C.gold} strokeWidth="1.1" />
    <line x1="56" y1="10" x2="52" y2="24" stroke={C.gold} strokeWidth="1.1" />
    <line x1="56" y1="10" x2="60" y2="24" stroke={C.gold} strokeWidth="1.1" />
    <path d="M2 24a6 6 0 0 0 12 0z" stroke={C.gold} strokeWidth="1.1" />
    <path d="M50 24a6 6 0 0 0 12 0z" stroke={C.gold} strokeWidth="1.1" />
    <line x1="32" y1="10" x2="32" y2="34" stroke={C.gold} strokeWidth="1.4" />
    <line x1="24" y1="34" x2="40" y2="34" stroke={C.gold} strokeWidth="1.4" />
  </svg>
);

// =========================================================================
// TAB 1 — weight add / subtract calculator
// =========================================================================
function WeightAddSubtract() {
  const [ak, setAk] = useState("0");
  const [ap, setAp] = useState("0");
  const [ay, setAy] = useState("0");
  const [bk, setBk] = useState("0");
  const [bp, setBp] = useState("0");
  const [by, setBy] = useState("0");
  const [op, setOp] = useState("add");

  const A = toPel(ak, ap, ay);
  const B = toPel(bk, bp, by);
  const total = op === "add" ? A + B : A - B;
  const isNegative = total < 0;

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 20 }}>
      <Hint>ရွှေအလေးချိန် နှစ်ခုကို ကျပ်/ပဲ/ရွေး နှုန်းဖြင့် အပေါင်း (သို့) အနှုတ် လုပ်ပါ။ ၁ ကျပ် = ၁၆ ပဲ • ၁ ပဲ = ၈ ရွေး</Hint>
      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
        <Label>အလေးချိန် (က)</Label>
        <WeightInputs k={ak} p={ap} y={ay} setK={setAk} setP={setAp} setY={setAy} />
      </div>
      <div style={{ display: "flex", justifyContent: "center", gap: 8 }}>
        {[
          { id: "add", label: "＋ ပေါင်း" },
          { id: "sub", label: "－ နှုတ်" },
        ].map((o) => {
          const isActive = op === o.id;
          return (
            <button
              key={o.id}
              onClick={() => setOp(o.id)}
              style={{
                flex: 1,
                borderRadius: 10,
                padding: "10px 0",
                fontSize: 14,
                fontWeight: 600,
                border: `1px solid ${isActive ? C.gold : C.fieldBorder}`,
                cursor: "pointer",
                background: isActive ? C.gold : "transparent",
                color: isActive ? "#1a1610" : C.mutedText,
                transition: "background 0.15s, color 0.15s, border-color 0.15s",
              }}
            >
              {o.label}
            </button>
          );
        })}
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
        <Label>အလေးချိန် (ခ)</Label>
        <WeightInputs k={bk} p={bp} y={by} setK={setBk} setP={setBp} setY={setBy} />
      </div>
      <Divider />
      {isNegative ? (
        <ResultCard title="ရလဒ်" accent="#b35633">
          (ခ) က (က) ထက်ကြီးနေသဖြင့် ရလဒ်မှာ အနှုတ်တန်ဖိုးဖြစ်သွားပါသည် — အလေးချိန်နေရာ လဲပြီးထပ်စမ်းကြည့်ပါ။
        </ResultCard>
      ) : (
        <ResultCard title={op === "add" ? "ပေါင်းလဒ် စုစုပေါင်း" : "နှုတ်ပြီးလက်ကျန်"}>
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            <div style={{ color: C.gold, fontSize: 18, fontWeight: 600 }}>
              <WeightLine {...fromPel(total)} />
            </div>
            <Note>ကျပ်ပြည့်ဖြင့် — {fmt(total / 16, 4)} ကျပ် • ပဲပြည့်ဖြင့် — {fmt(total, 3)} ပဲ • ရွေးပြည့်ဖြင့် — {fmt(total * 8, 2)} ရွေး</Note>
          </div>
        </ResultCard>
      )}
    </div>
  );
}

// =========================================================================
// TAB 2 — alloy / purity (စပ်ခဲ) calculator
// =========================================================================
function AlloyCalculator() {
  const [k, setK] = useState("0");
  const [p, setP] = useState("13");
  const [y, setY] = useState("0");
  const [fromPurity, setFromPurity] = useState("16");
  const [toPurity, setToPurity] = useState("13");

  const W1 = toPel(k, p, y);
  const P1 = Number(fromPurity) || 0;
  const P2 = Number(toPurity) || 0;

  const result = useMemo(() => {
    if (!W1 || !P1 || !P2) return null;
    if (P1 > P2) {
      const Wf = (W1 * P1) / P2;
      const alloy = Wf - W1;
      return { mode: "dilute", alloy, Wf };
    }
    if (P2 > P1) {
      if (P2 >= 16) return { mode: "impossible" };
      const x = (W1 * (P2 - P1)) / (16 - P2);
      return { mode: "enrich", pureAdd: x, Wf: W1 + x };
    }
    return { mode: "same" };
  }, [W1, P1, P2]);

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 20 }}>
      <Hint>လက်ရှိရွှေအလေးချိန်နှင့် ပဲရည်ကို ထည့်ပြီး ပြောင်းလိုသောပဲရည်ကို ရွေးပါ — စပ်ရမည့် ဇပ်/ရွှေချိန်ကို တွက်ပေးပါမည်။</Hint>
      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
        <Label>လက်ရှိအလေးချိန်</Label>
        <WeightInputs k={k} p={p} y={y} setK={setK} setP={setP} setY={setY} />
      </div>
      <div className="grid2">
        <PuritySelect label="လက်ရှိပဲရည်" value={fromPurity} onChange={setFromPurity} />
        <PuritySelect label="ပြောင်းလိုသောပဲရည်" value={toPurity} onChange={setToPurity} />
      </div>
      <Divider />
      {!result && <Hint>အလေးချိန်နှင့် ပဲရည်များကို ဖြည့်ပါ။</Hint>}
      {result && result.mode === "same" && (
        <ResultCard title="ရလဒ်">ပဲရည်နှစ်ခု တူညီနေသဖြင့် စပ်ရန်မလိုပါ။</ResultCard>
      )}
      {result && result.mode === "impossible" && (
        <ResultCard title="ရလဒ်" accent="#b35633">၁၆ ပဲရည်ထက် မြင့်၍မရသောကြောင့် ဤပြောင်းလဲမှုကို တွက်ချက်၍မရပါ။</ResultCard>
      )}
      {result && result.mode === "dilute" && (
        <ResultCard title={`${fmt(P1)} ပဲရည် → ${fmt(P2)} ပဲရည် (စပ်ခဲ ထည့်ရန်)`}>
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            <div>ထည့်ရမည့် စပ်ခဲအလေးချိန် — <span style={{ color: C.gold }}><WeightLine {...fromPel(result.alloy)} /></span></div>
            <div>စပ်ပြီးရလဒ် စုစုပေါင်းအလေးချိန် — <span style={{ color: C.gold }}><WeightLine {...fromPel(result.Wf)} /></span></div>
          </div>
        </ResultCard>
      )}
      {result && result.mode === "enrich" && (
        <ResultCard title={`${fmt(P1)} ပဲရည် → ${fmt(P2)} ပဲရည် (ရွှေစင်ထည့်ရန်)`}>
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            <div>ထည့်ရမည့် ၁၆ ပဲရည် ရွှေစင်အလေးချိန် — <span style={{ color: C.gold }}><WeightLine {...fromPel(result.pureAdd)} /></span></div>
            <div>စပ်ပြီးရလဒ် စုစုပေါင်းအလေးချိန် — <span style={{ color: C.gold }}><WeightLine {...fromPel(result.Wf)} /></span></div>
          </div>
        </ResultCard>
      )}
      <Note>* ၁၆ ပဲရည် = ရွှေစင်ရည် အနေနှင့် သတ်မှတ်ထားပါသည်။ စပ်ခဲသည် ရွှေဓာတ် လုံးဝမပါဟု ယူဆတွက်ချက်ထားပါသည်။</Note>
    </div>
  );
}

// =========================================================================
// TAB 3 — inner/outer mix spread (အတွင်းစပ် / အပြင်စပ်)
// =========================================================================
function SpreadCalculator() {
  const [pelYi, setPelYi] = useState("15");
  const [ywayYi, setYwayYi] = useState("0");
  const [pricePerKyat, setPricePerKyat] = useState("9500000");

  const P = (Number(pelYi) || 0) + (Number(ywayYi) || 0) / 8;
  const price = Number(pricePerKyat) || 0;

  const calc = useMemo(() => {
    if (!price || P <= 0 || P > 16) return null;
    const innerValue = (P / 16) * price;
    const outerValue = (16 / (16 + (16 - P))) * price;
    const diff = outerValue - innerValue;
    const innerPct = (P / 16) * 100;
    const outerPct = (16 / (32 - P)) * 100;
    const alloy = 16 - P;
    return { innerValue, outerValue, diff, innerPct, outerPct, alloy };
  }, [P, price]);

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 20 }}>
      <Hint>
        တွက်ချက်လိုသော ပဲရည်နှင့် အခေါက်ပေါက်ဈေး (၁ ကျပ်သား) ကို ထည့်ပါ — <b>အတွင်းစပ်ဈေး</b>၊ <b>အပြင်စပ်ဈေး</b> နှင့် ဈေးကွာခြားမှုကို ၁ ကျပ်သားနှုန်းဖြင့် တွက်ပေးပါမည်။
      </Hint>
      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
        <Label>တွက်မည့်ပဲရည်</Label>
        <div className="grid2">
          <NumberField label="ပဲရည်" value={pelYi} onChange={setPelYi} />
          <NumberField label="ရွေးရည်" value={ywayYi} onChange={setYwayYi} />
        </div>
        <Note>= {fmt(Math.floor(P), 0)} ပဲ {fmt((P - Math.floor(P)) * 8, 2)} ရွေးရည် ({fmt(P, 4)} ပဲရည်)</Note>
      </div>
      <NumberField label="အခေါက်ပေါက်ဈေး / ၁ ကျပ်သား" value={pricePerKyat} onChange={setPricePerKyat} suffix="ကျပ်" />
      <Divider />
      {!calc && <Hint>ပဲရည် (၁–၁၆) နှင့် အခေါက်ဈေးကို မှန်ကန်စွာဖြည့်ပါ။</Hint>}
      {calc && (
        <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
          <div>
            <Note>အတွင်းစပ်ဈေး = ပဲရည် ÷ ၁၆ × အခေါက်ဈေး</Note>
            <div style={{ color: C.gold, fontSize: 22, fontWeight: 700, marginTop: 4 }}>{fmt(calc.innerValue, 0)} ကျပ်</div>
            <Note>{fmt(P, 2)} ÷ 16 = {fmt(calc.innerPct, 4)}%</Note>
          </div>
          <Divider />
          <div>
            <Note>အပြင်စပ်ဈေး = ၁၆ ÷ [၁၆ + (၁၆ − ပဲရည်)] × အခေါက်ဈေး</Note>
            <div style={{ color: C.gold, fontSize: 22, fontWeight: 700, marginTop: 4 }}>{fmt(calc.outerValue, 0)} ကျပ်</div>
            <Note>
              အရောအချို {fmt(Math.floor(calc.alloy), 0)} ပဲ {fmt((calc.alloy - Math.floor(calc.alloy)) * 8, 2)} ရွေး ထည့်သောဘော် | 16 ÷ {fmt(32 - P, 0)} = {fmt(calc.outerPct, 4)}%
            </Note>
          </div>
          <Divider />

function MarketPriceCalculator() {
  const [pricePerKyat, setPricePerKyat] = useState("");
  const [refPurity, setRefPurity] = useState("16");
  const [k, setK] = useState("0");
  const [p, setP] = useState("1");
  const [y, setY] = useState("0");
  const [goldPurity, setGoldPurity] = useState("16");

  const price = Number(pricePerKyat) || 0;
  const R = Number(refPurity) || 16;
  const W = toPel(k, p, y);
  const G = Number(goldPurity) || 0;

  const value = useMemo(() => {
    if (!price || !W || !G || !R) return null;
    const pricePerKyatPure16 = (price / R) * 16;
    const kyatWeight = W / 16;
    return (pricePerKyatPure16 * G * kyatWeight) / 16;
  }, [price, W, G, R]);

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 20 }}>
      <Hint>ကာလပေါက်ဈေး (ကျပ်သားလျှင်) ကို ထည့်ပြီး ရွှေအလေးချိန်၊ ပဲရည်နှင့် တွက်ချက်ပေးပါသည်။</Hint>
      <div className="grid2">
        <NumberField label="ကျပ်သားစျေး" value={pricePerKyat} onChange={setPricePerKyat} suffix="ကျပ်" />
        <PuritySelect label="ဈေးနှုန်း၏ပဲရည်" value={refPurity} onChange={setRefPurity} />
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
        <Label>ရွှေအလေးချိန်</Label>
        <WeightInputs k={k} p={p} y={y} setK={setK} setP={setP} setY={setY} />
      </div>
      <PuritySelect label="ဤရွှေ၏ ပဲရည်" value={goldPurity} onChange={setGoldPurity} />
      <Divider />
      {value === null ? (
        <Hint>ဈေးနှုန်း၊ အလေးချိန်၊ ပဲရည် အားလုံးဖြည့်ပါ။</Hint>
      ) : (
        <ResultCard title="ခန့်မှန်းတန်ဖိုး" accent={C.gold}>
          <span style={{ color: C.gold, fontSize: 26, fontWeight: 700 }}>{fmt(value)}</span> ကျပ်
        </ResultCard>
      )}
    </div>
  );
}

const normalizeEmail = (value) => String(value || "").trim().toLowerCase();

async function getAccessProfile(user) {
  if (!user) return { allowed: false, admin: false, reason: "not-signed-in" };
  if (!window.db) {
    throw window.firestoreStartupError || new Error("Firestore မချိတ်ဆက်ရသေးပါ။");
  }

  const adminSnap = await window.db.collection("admins").doc(user.uid).get();
  if (adminSnap.exists) {
    const adminData = adminSnap.data() || {};
    if (adminData.active === true && adminData.role === "admin") {
      return { allowed: true, admin: true, role: "admin" };
    }
  }

  const email = normalizeEmail(user.email);
  if (!email) return { allowed: false, admin: false, reason: "missing-email" };
  if (!user.emailVerified) {
    return { allowed: false, admin: false, reason: "email-not-verified" };
  }

  const allowedSnap = await window.db.collection("allowedEmails").doc(email).get();
  if (!allowedSnap.exists) {
    return { allowed: false, admin: false, reason: "not-allowed" };
  }

  const allowedData = allowedSnap.data() || {};
  if (allowedData.active !== true) {
    return { allowed: false, admin: false, reason: "inactive" };
  }

  return {
    allowed: true,
    admin: false,
    role: allowedData.role || "user",
  };
}

  const [panelError, setPanelError] = useState("");

  const loadUsers = async () => {
    setLoading(true);
    setPanelError("");
    try {
      if (!window.db) throw window.firestoreStartupError || new Error("Firestore မချိတ်ဆက်ရသေးပါ။");
      const snap = await window.db.collection("allowedEmails").orderBy("email").get();
      const rows = snap.docs.map((doc) => ({ id: doc.id, ...doc.data() }));
      setUsers(rows);
    } catch (err) {
      setPanelError("အသုံးပြုသူစာရင်း မဖတ်နိုင်ပါ — " + (err.message || err));
    } finally {
      setLoading(false);
    }
  };

  React.useEffect(() => {
    loadUsers();
  }, []);

  const handleAddUser = async (e) => {
    e.preventDefault();
    setMessage("");
    setPanelError("");

    const email = normalizeEmail(newEmail);
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      setPanelError("Email လိပ်စာကို မှန်ကန်စွာဖြည့်ပါ။");
      return;

      return;
    }

    setSaving(true);
    let secondaryAuth = null;
    try {
      let authUserCreated = false;
      let verificationSent = false;

      if (newPassword) {

        if (!secondaryApp) {
          secondaryApp = firebase.initializeApp(window.firebaseConfig, "PSTUserCreator");
        }
        secondaryAuth = secondaryApp.auth();

        try {
          const credential = await secondaryAuth.createUserWithEmailAndPassword(email, newPassword);
          authUserCreated = true;
          if (credential.user) {
            try {
              await credential.user.sendEmailVerification();
              verificationSent = true;
            } catch (_) {}
          }
        } catch (err) {
          if (err.code !== "auth/email-already-in-use") throw err;
        }

      const ref = window.db.collection("allowedEmails").doc(email);
      const existing = await ref.get();
      const now = firebase.firestore.FieldValue.serverTimestamp();

      if (existing.exists) {
        const existingData = existing.data() || {};
        await ref.update({
          active: true,
          role: existingData.role === "admin" ? "admin" : "user",
          updatedAt: now,
          updatedBy: currentUser.uid,
        });
      } else {
        await ref.set({
          email,
          active: true,
          role: "user",
          createdAt: now,
          createdBy: currentUser.uid,
          updatedAt: now,
          updatedBy: currentUser.uid,
        });
      }

      if (secondaryAuth) await secondaryAuth.signOut();
      setNewEmail("");
      setNewPassword("");
      setMessage(
        authUserCreated
          ? verificationSent
            ? "User account ဖန်တီးပြီး Verification Email ပို့ထားပါသည်။ Email အတည်ပြုပြီးမှ ဝင်နိုင်ပါမည်။"
            : "User account နှင့် ဝင်ရောက်ခွင့်ကို ဖန်တီးပြီးပါပြီ။"

      );
      await loadUsers();
    } catch (err) {
      if (secondaryAuth) {
        try { await secondaryAuth.signOut(); } catch (_) {}
      }
      if (err.code === "auth/invalid-email") setPanelError("Email format မှားနေပါတယ်။");
      else if (err.code === "auth/weak-password") setPanelError("Password အနည်းဆုံး ၆ လုံးထည့်ပါ။");
      else if (err.code === "auth/operation-not-allowed") setPanelError("Firebase Authentication မှာ Email/Password ကို Enable လုပ်ပါ။");

    setPanelError("");
    setMessage("");
    try {
      await window.db.collection("allowedEmails").doc(item.id).update({

        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),

    setMessage("");
    try {
      await window.db.collection("allowedEmails").doc(item.id).delete();

      await loadUsers();
    } catch (err) {
      setPanelError("User ကို မဖယ်ရှားနိုင်ပါ — " + (err.message || err));

              Admin — {normalizeEmail(currentUser.email)}
            </p>
          </div>
          <button onClick={onClose} style={{ width: 34, height: 34, borderRadius: 9, border: `1px solid ${C.fieldBorder}`, background: C.fieldBg, color: C.cream, cursor: "pointer", fontSize: 18 }}>×</button>
        </div>

        <Divider />

        <form onSubmit={handleAddUser} style={{ display: "flex", flexDirection: "column", gap: 12 }}>
          <label style={{ display: "flex", flexDirection: "column", gap: 4 }}>
            <Label>Email အသစ်</Label>
            <div style={{ borderRadius: 10, border: `1px solid ${C.fieldBorder}`, background: C.fieldBg }}>
              <input type="email" value={newEmail} onChange={(e) => setNewEmail(e.target.value)} placeholder="example@gmail.com" autoCapitalize="none" style={{ width: "100%", background: "transparent", border: "none", outline: "none", padding: "11px 12px", color: C.cream, fontSize: 14 }} />

          <label style={{ display: "flex", flexDirection: "column", gap: 4 }}>

function AuthGate() {
  const [user, setUser] = useState(undefined);
  const [access, setAccess] = useState({ admin: false });
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);
  const [showUsers, setShowUsers] = useState(false);

  React.useEffect(() => {
    let mounted = true;
    const startupTimer = window.setTimeout(() => {
      if (mounted) setUser((current) => current === undefined ? null : current);
    }, 10000);

    const unsub = firebase.auth().onAuthStateChanged(async (signedInUser) => {
      if (!mounted) return;
      if (!signedInUser) {
        setAccess({ admin: false });
        setUser(null);
        return;
      }

      setUser(undefined);
      try {
        const profile = await getAccessProfile(signedInUser);
        if (!mounted) return;

        if (profile.allowed) {
          setError("");
          setAccess({ admin: profile.admin === true });
          setUser(signedInUser);
          return;
        }

        const signedInEmail = normalizeEmail(signedInUser.email);
        if (profile.reason === "email-not-verified") {
          try { await signedInUser.sendEmailVerification(); } catch (_) {}
          setError("ဒီ Email ကို အတည်မပြုရသေးပါ။ Verification Email ပို့ထားပါသည်။ Email ထဲမှ link ကိုနှိပ်ပြီး ပြန်ဝင်ပါ။");
        } else if (profile.reason === "inactive") {
          setError("ဒီ Email ၏ ဝင်ရောက်ခွင့်ကို Admin က ပိတ်ထားပါသည်။");
        } else {
          setError("ဒီ Email (" + signedInEmail + ") ကို ခွင့်ပြုမထားပါ။ Admin ကို ဆက်သွယ်ပါ။");
        }
        await firebase.auth().signOut();
      } catch (err) {
        if (!mounted) return;
        setError("ဝင်ရောက်ခွင့် မစစ်ဆေးနိုင်ပါ။ Firestore Rules၊ Admin UID နှင့် Internet ကို စစ်ပါ — " + (err.message || err));
        await firebase.auth().signOut();
      }
    });

    return () => {
      mounted = false;
      window.clearTimeout(startupTimer);
      unsub();
    };
  }, []);

  const handleLogin = async (e) => {
    e.preventDefault();
    setError("");
    setBusy(true);
    try {
      await firebase.auth().signInWithEmailAndPassword(normalizeEmail(email), password);
    } catch (err) {
      if (err.code === "auth/invalid-email") setError("Email format မှားနေပါတယ်။");
      else if (["auth/user-not-found", "auth/wrong-password", "auth/invalid-credential"].includes(err.code)) setError("Email သို့မဟုတ် Password မှားနေပါတယ်။");
      else if (err.code === "auth/too-many-requests") setError("ကြိုးစားမှုများနေလို့ ခဏစောင့်ပြီး ပြန်စမ်းပါ။");
      else setError("Login မဝင်နိုင်ပါ — " + (err.message || err));
    } finally {
      setBusy(false);
    }
  };

  const handleGoogleLogin = async () => {
    setError("");
    setBusy(true);
    try {
      const provider = new firebase.auth.GoogleAuthProvider();
      provider.setCustomParameters({ prompt: "select_account" });
      await firebase.auth().signInWithPopup(provider);
    } catch (err) {
      if (err.code !== "auth/popup-closed-by-user") {
        setError("Google Login မဝင်နိုင်ပါ — " + (err.message || err));
      }
    } finally {
      setBusy(false);
    }
  };

  const handleLogout = async () => {
    setShowUsers(false);
    await firebase.auth().signOut();
  };

  if (user === undefined) {
    return (
      <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", background: C.bg, color: C.dimText, fontFamily: "'Noto Sans Myanmar',sans-serif" }}>
        Firebase ခွင့်ပြုချက် စစ်ဆေးနေသည်...
      </div>
    );
  }

  if (!user) {
    return (
      <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", background: C.bg, padding: 16, fontFamily: "'Noto Sans Myanmar',sans-serif" }}>
        <div style={{ width: "100%", maxWidth: 360, borderRadius: 18, border: `1px solid ${C.panelBorder}`, background: C.panel, padding: 28, boxShadow: "0 20px 50px rgba(0,0,0,0.45)" }}>
          <div style={{ display: "flex", flexDirection: "column", alignItems: "center", marginBottom: 20 }}>
            <ScaleMark />
            <h1 style={{ fontFamily: "'Noto Serif Myanmar', serif", fontSize: 20, fontWeight: 700, color: C.cream, margin: "8px 0 0" }}>PST ရွှေတွက်ချက်ကိရိယာ</h1>
            <p style={{ fontSize: 12, color: C.dimText, marginTop: 4 }}>ဝင်ရောက်ရန် Login လိုအပ်ပါသည်</p>
          </div>

          <button type="button" onClick={handleGoogleLogin} disabled={busy} style={{ width: "100%", display: "flex", alignItems: "center", justifyContent: "center", gap: 8, borderRadius: 10, padding: "11px 0", fontSize: 14, fontWeight: 600, border: `1px solid ${C.fieldBorder}`, cursor: busy ? "default" : "pointer", background: C.fieldBg, color: C.cream, opacity: busy ? 0.6 : 1 }}>
            <svg width="18" height="18" viewBox="0 0 48 48">
              <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l6-6C34.5 5.6 29.5 3.5 24 3.5 12.7 3.5 3.5 12.7 3.5 24S12.7 44.5 24 44.5 44.5 35.3 44.5 24c0-1.2-.1-2.4-.4-3.5z" />
              <path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.6 15.9 19 13.5 24 13.5c3.1 0 5.9 1.2 8 3.1l6-6C34.5 6.6 29.5 4.5 24 4.5 15.6 4.5 8.4 9.4 6.3 14.7z" />
              <path fill="#4CAF50" d="M24 44.5c5.4 0 10.3-2.1 13.9-5.4l-6.4-5.4C29.5 35.4 26.9 36.5 24 36.5c-5.3 0-9.7-3.1-11.3-7.9l-6.5 5C8.3 39.5 15.6 44.5 24 44.5z" />
              <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-1 3-3.1 5.5-5.9 7l6.4 5.4C39.6 37 44.5 31 44.5 24c0-1.2-.1-2.4-.4-3.5z" />
            </svg>
            Google ဖြင့် ဝင်မည်
          </button>

          <div style={{ display: "flex", alignItems: "center", gap: 10, margin: "18px 0" }}>
            <div style={{ flex: 1, height: 1, background: C.panelBorder }} />
            <span style={{ fontSize: 11, color: C.faintText }}>သို့မဟုတ်</span>
            <div style={{ flex: 1, height: 1, background: C.panelBorder }} />
          </div>

          <form onSubmit={handleLogin} style={{ display: "flex", flexDirection: "column", gap: 12 }}>
            <label style={{ display: "flex", flexDirection: "column", gap: 4 }}>
              <Label>Email</Label>
              <div style={{ borderRadius: 10, border: `1px solid ${C.fieldBorder}`, background: C.fieldBg }}>
                <input type="email" value={email} onChange={(e) => setEmail(e.target.value)} autoCapitalize="none" style={{ width: "100%", background: "transparent", border: "none", outline: "none", padding: "10px 12px", color: C.cream, fontSize: 15 }} />
              </div>
            </label>
            <label style={{ display: "flex", flexDirection: "column", gap: 4 }}>
              <Label>Password</Label>
              <div style={{ borderRadius: 10, border: `1px solid ${C.fieldBorder}`, background: C.fieldBg }}>
                <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} style={{ width: "100%", background: "transparent", border: "none", outline: "none", padding: "10px 12px", color: C.cream, fontSize: 15 }} />
              </div>
            </label>
            {error && <div style={{ color: C.danger, fontSize: 12, lineHeight: 1.6 }}>{error}</div>}
            <button type="submit" disabled={busy} style={{ marginTop: 4, borderRadius: 10, padding: "12px 0", fontSize: 15, fontWeight: 700, border: "none", cursor: busy ? "default" : "pointer", background: C.gold, color: "#1a1610", opacity: busy ? 0.6 : 1 }}>
              {busy ? "ဝင်နေသည်..." : "ဝင်မည်"}
            </button>
          </form>
        </div>
      </div>
    );
  }

  return (
    <div style={{ position: "relative" }}>
      {access.admin && (
        <button onClick={() => setShowUsers(true)} style={{ position: "fixed", top: 10, left: 10, zIndex: 50, borderRadius: 8, padding: "6px 10px", fontSize: 11, border: `1px solid ${C.fieldBorder}`, background: C.panel, color: C.gold, cursor: "pointer" }}>
          👤 အသုံးပြုသူ
        </button>
      )}

      <button onClick={handleLogout} style={{ position: "fixed", top: 10, right: 10, zIndex: 50, borderRadius: 8, padding: "6px 12px", fontSize: 12, border: `1px solid ${C.fieldBorder}`, background: C.panel, color: C.mutedText, cursor: "pointer" }}>
        ⎋ ထွက်မည်
      </button>

      <App />

      {showUsers && access.admin && (
        <UserManager currentUser={user} onClose={() => setShowUsers(false)} />
      )}
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<AuthGate />);
</script>

<script>
  // React/Firebase CDN မတက်လျှင် blank screen အစား အကြောင်းပြချက်ပြရန်
  window.setTimeout(function () {
    var root = document.getElementById("root");
    if (root && !root.innerHTML.trim()) {
      root.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#141110;padding:20px;font-family:sans-serif;color:#f4edd9"><div style="max-width:420px;border:1px solid #3a3327;border-radius:16px;background:#181410;padding:22px;line-height:1.7"><b style="color:#c9962c">App မစတင်နိုင်ပါ</b><br>Internet ချိတ်ဆက်မှုကို စစ်ဆေးပြီး Chrome ဖြင့် ပြန်ဖွင့်ပါ။ React သို့မဟုတ် Firebase CDN မတက်လာခြင်း ဖြစ်နိုင်ပါသည်။</div></div>';
    }
  }, 10000);
</script>

<script>
  if ("serviceWorker" in navigator && location.protocol !== "file:") {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("service-worker.js").catch(() => {});
    });
  }
</script>
</body>
</html>
